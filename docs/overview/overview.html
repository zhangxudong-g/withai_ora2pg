<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oracle → PostgreSQL 迁移实施路线图</title>
<style>
:root{
  --bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#64748b;
  --border:#dbe2ea;--accent:#2563eb;--accent-bg:#eff6ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.6}
.container{max-width:1180px;margin:0 auto;padding:40px 24px 56px}
header{text-align:center;margin-bottom:34px}
h1{font-size:clamp(26px,4vw,42px);margin:0 0 10px}
.subtitle{color:var(--muted);font-size:16px}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.node{background:var(--panel);border:2px solid var(--border);border-radius:16px;padding:22px;text-align:left;cursor:pointer;transition:.2s;min-height:170px}
.node:hover{transform:translateY(-3px);border-color:#93b4f8}
.node.active{border-color:var(--accent);background:var(--accent-bg)}
.phase{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.node h2{font-size:20px;margin:8px 0}
.node p{font-size:14px;color:var(--muted);margin:0}
.arrow{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:25px}
.detail{margin-top:26px;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:0 8px 24px #1720330b}
.detail h2{margin:4px 0 12px;font-size:27px}
.detail p{margin:8px 0}
.detail ul{padding-left:24px}
.output{margin-top:20px;padding:16px 18px;border-left:4px solid var(--accent);background:var(--accent-bg);border-radius:8px}
.footer{margin-top:28px;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:800px){.flow{grid-template-columns:1fr}.node{min-height:auto}.container{padding:26px 16px 40px}}
@media print{
 body{background:#fff}.container{max-width:none;padding:0}.node{break-inside:avoid}.detail{box-shadow:none}
}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>Oracle → PostgreSQL 迁移实施路线图</h1>
  <div class="subtitle">从基础转换引擎，到 Agent + Skill，再到 GKB 全量迁移</div>
</header>

<section class="flow" aria-label="迁移阶段">
  <button class="node active" data-id="1">
    <div class="phase">Phase 01 · 基础</div>
    <h2>建立转换基准与验证框架</h2>
    <p>典型 SQL · 覆盖矩阵 · 验证标准</p>
  </button>
  <button class="node" data-id="2">
    <div class="phase">Phase 02 · 引擎</div>
    <h2>修复脚本转换引擎</h2>
    <p>通用规则 · 模块化 · 回归测试</p>
  </button>
  <button class="node" data-id="3">
    <div class="phase">Phase 03 · 基线</div>
    <h2>验证 SQLines 转换能力</h2>
    <p>独立转换 · 统一验证 · 差异清单</p>
  </button>
  <button class="node" data-id="4">
    <div class="phase">Phase 04 · 智能转换</div>
    <h2>构建 Agent + Skill</h2>
    <p>规则识别 · LLM · 脚本复用</p>
  </button>
  <button class="node" data-id="5">
    <div class="phase">Phase 05 · PoC</div>
    <h2>典型案例端到端验证</h2>
    <p>多种转换方案 · 结果对比 · 风险</p>
  </button>
  <button class="node" data-id="6">
    <div class="phase">Phase 06 · 迁移</div>
    <h2>扩展到 GKB 全量迁移</h2>
    <p>分批迁移 · 回归测试 · 人工确认</p>
  </button>
</section>

<section class="detail" id="detail" aria-live="polite"></section>

<div class="footer">
  核心原则：转换成功 ≠ 迁移正确。所有关键结果必须经过验证。
</div>
</div>

<script>
const data={
1:{title:"建立转换基准与验证框架",goal:"先建立统一的评估标准，确保后续脚本、SQLines 和 LLM 结果可以客观比较。",tasks:["整理基础 SQL、复杂嵌套、聚合、日期、字符串、分页、动态 SQL、PL/SQL、DBMS_SQL、Package 等案例","建立 SQL 特性与复杂度覆盖矩阵","定义语法、结果、边界、异常、数据变更和性能验证方法"],output:"典型案例集、验证标准、测试目录结构"},
2:{title:"修复并完善脚本转换引擎",goal:"打造稳定、可扩展、可回归测试的基础转换能力。",tasks:["修复现有简单 SQL 转换问题","改进复杂嵌套 SQL 处理","将规则模块化并分类管理","增加转换失败、风险识别和原始 SQL 保留机制","每次修复增加回归测试"],output:"通用转换引擎、规则模块、回归测试集"},
3:{title:"验证 SQLines 转换能力",goal:"将 SQLines 作为独立参考基线，识别其适用范围和局限。",tasks:["使用同一批典型案例执行 SQLines 转换","采用统一验证标准检查结果","记录转换错误、语义差异和不支持场景","整理可复用规则及限制清单"],output:"SQLines 验证报告、差异清单、规则补充项"},
4:{title:"构建 Agent + Skill 转换方案",goal:"由 LLM 负责上下文分析和复杂语义转换，基础脚本负责稳定处理。",tasks:["分析源码、对象类型和依赖关系","识别 Oracle 特有语法与 API","检索并应用转换规则","调用可复用转换脚本","处理复杂 SQL / PL/SQL 语义","生成验证用例、执行验证并输出风险报告"],output:"Agent、可复用 Skill、转换规则库、验证流程"},
5:{title:"典型案例端到端 PoC",goal:"用真实且具有代表性的案例验证整体方案，而不是只验证语法转换。",tasks:["普通 Function","复杂嵌套 SQL","包含动态 SQL 的 Procedure","包含 DBMS_SQL 的 Procedure","包含内部依赖的 Package","比较脚本、SQLines 和 Agent + Skill 的结果与风险"],output:"PoC 结果对比报告、问题清单、改进计划"},
6:{title:"扩展到 GKB 全量迁移",goal:"在典型案例和验证机制稳定后，分批推进实际迁移。",tasks:["按表定义、数据、Function / Procedure、Package、Trigger 分批迁移","执行分批验证和回归测试","记录无法自动转换的内容","对高风险对象进行人工设计和确认","持续完善规则与 Skill"],output:"GKB 迁移成果、风险清单、验证记录、遗留问题清单"}
};

const detail=document.getElementById("detail");
const nodes=document.querySelectorAll(".node");
function render(id){
  const d=data[id];
  nodes.forEach(n=>n.classList.toggle("active",n.dataset.id===String(id)));
  detail.innerHTML=`
    <div class="phase">Phase ${String(id).padStart(2,"0")}</div>
    <h2>${d.title}</h2>
    <p><strong>目标：</strong>${d.goal}</p>
    <h3>主要任务</h3>
    <ul>${d.tasks.map(t=>`<li>${t}</li>`).join("")}</ul>
    <div class="output"><strong>主要产出：</strong>${d.output}</div>
  `;
}
nodes.forEach(n=>n.addEventListener("click",()=>render(n.dataset.id)));
render(1);
</script>
</body>
</html>
